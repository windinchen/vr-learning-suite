<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VR 学习套件 · 老师管理台</title>
<link rel="stylesheet" href="/css/app.css" />
</head>
<body>
<div id="login" class="login-wrap hidden">
  <form id="login-form" class="login-card" autocomplete="off">
    <div class="brand-mark">VR</div>
    <h1>VR 学习套件管理台</h1>
    <p class="muted">老师登录后可管理 PICO 头显、应用开关与学生使用时长</p>
    <label>账号<input name="account" value="admin" required /></label>
    <label>密码<input name="password" type="password" placeholder="请输入密码" required /></label>
    <button type="submit" class="primary">登录</button>
    <div id="login-error" class="error"></div>
    <p class="hint">演示账号 admin / pico123456</p>
  </form>
</div>

<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="side-brand"><span class="brand-mark sm">VR</span><div><b>VR 学习套件</b><small>老师管理台</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div id="who"></div>
      <button id="logout" class="ghost">退出登录</button>
    </div>
  </aside>
  <main>
    <header class="topbar">
      <div><h2 id="page-title">总览</h2><p id="page-sub" class="muted"></p></div>
      <div class="top-right">
        <span id="clock" class="clock"></span>
        <button id="refresh" class="ghost">刷新</button>
      </div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>
<div id="toast" class="toast hidden"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
